<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>AirLink</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f9e"/><stop offset="1" stop-color="#b82fd0"/></linearGradient></defs></svg>

<div id="splash">
  <svg class="mk" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="24" fill="url(#ag)"/><g stroke="#fff" stroke-width="7" stroke-linecap="round"><path d="M24 44 A38 38 0 0 1 76 44"/><path d="M33 54 A25 25 0 0 1 67 54"/><path d="M42 64 A12 12 0 0 1 58 64"/></g><circle cx="50" cy="75" r="5" fill="#fff"/></svg>
  <div class="sn">AirLink</div>
</div>

<div class="app">
  <header>
    <svg class="mk" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="24" fill="url(#ag)"/><g stroke="#fff" stroke-width="8" stroke-linecap="round"><path d="M24 44 A38 38 0 0 1 76 44"/><path d="M33 54 A25 25 0 0 1 67 54"/><path d="M42 64 A12 12 0 0 1 58 64"/></g><circle cx="50" cy="75" r="5.5" fill="#fff"/></svg>
    <b>AirLink</b>
    <div class="pill" id="pill">Off</div>
    <button class="gbtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </header>
  <div id="view"></div>
</div>
<div id="sw"><div id="sheet"></div></div>
<div id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
